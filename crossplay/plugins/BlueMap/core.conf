# Gunthercraft - BlueMap core.conf
# 3D-Weltkarte im Browser
# Download: https://www.spigotmc.org/resources/bluemap.83557/
# ==============================================================

# Wo BlueMap seine Daten speichert
data: "bluemap"

# Maximale Render-Threads (CPU-Kerne für das Kartengenerieren)
# -1 = automatisch (alle verfügbaren Kerne)
render-thread-count: 2

# Metriken deaktivieren wenn gewünscht
metrics: true

# Ressourcenpack-Scan für Custom-Texturen
scan-for-mod-resources: true

# ==================================
# NACH ERSTER SERVERSTART:
# /bluemap renders        -- Renderstatus anzeigen
# /bluemap render         -- Vollständigen Render starten
# /bluemap pause          -- Render pausieren (für Updates)
# ==================================
