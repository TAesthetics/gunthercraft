# Gunthercraft - BlueMap core.conf
# 3D world map in the browser
# Download: https://www.spigotmc.org/resources/bluemap.83557/
# ==============================================================

# Where BlueMap stores its data
data: "bluemap"

# Maximum render threads (CPU cores used for map rendering)
# -1 = automatic (all available cores)
render-thread-count: 2

# Disable metrics if desired
metrics: true

# Scan resource packs for custom textures
scan-for-mod-resources: true

# ==================================
# AFTER FIRST SERVER START:
# /bluemap renders        -- show render status
# /bluemap render         -- start a full render
# /bluemap pause          -- pause render (for updates)
# ==================================
