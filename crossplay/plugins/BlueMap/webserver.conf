# Gunthercraft - BlueMap webserver.conf
# Eingebetteter Webserver für die Weltkarte
# ==========================================

# Webserver aktivieren
enabled: true

# IP auf der der Webserver lauscht (0.0.0.0 = alle Interfaces)
ip: "0.0.0.0"

# Port für den BlueMap-Webserver
# Im Browser aufrufbar unter: http://SERVERIP:8100
port: 8100

# MaxConnections (Standard reicht für Community-Server)
max-connections-per-throttle: 0

# Wenn BlueMap hinter einem Reverse Proxy (nginx/apache) läuft:
# webroot auf den nginx/apache document-root setzen und eingebetteten Server deaktivieren
# enabled: false
# webroot: "/var/www/html/bluemap"
