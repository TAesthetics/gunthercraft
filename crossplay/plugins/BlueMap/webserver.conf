# Gunthercraft - BlueMap webserver.conf
# Built-in web server for the world map
# ==========================================

# Enable the web server
enabled: true

# IP the web server listens on (0.0.0.0 = all interfaces)
ip: "0.0.0.0"

# Port for the BlueMap web server
# Access in browser at: http://SERVERIP:8100
port: 8100

# Max connections (default is fine for community servers)
max-connections-per-throttle: 0

# If BlueMap runs behind a reverse proxy (nginx/apache):
# Set webroot to the nginx/apache document root and disable the built-in server
# enabled: false
# webroot: "/var/www/html/bluemap"
