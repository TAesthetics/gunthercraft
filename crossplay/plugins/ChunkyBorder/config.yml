# Gunthercraft - ChunkyBorder config.yml
# World borders + chunk pre-generation
# Download: https://www.spigotmc.org/resources/chunkyborder.80461/
# ================================================================
# NOTE: ChunkyBorder sets vanilla world borders automatically.
# Install Chunky (the main plugin) first for chunk pre-generation!

# World borders are set via commands, not this config file.
# The config is filled in automatically.

# === SETUP COMMANDS ===
#
# Main world (Earth Map) - 10000 block radius (adjust as needed)
# /chunky world world
# /chunky center 0 0
# /chunky radius 10000
# /chunky start
# /chunkyborder add world
#
# Nether - proportional to the main world (1/8 of overworld radius)
# /chunky world world_nether
# /chunky center 0 0
# /chunky radius 1250
# /chunky start
# /chunkyborder add world_nether
#
# End - smaller border
# /chunky world world_the_end
# /chunky center 0 0
# /chunky radius 5000
# /chunky start
# /chunkyborder add world_the_end
#
# Start pre-generation (important before launch!):
# /chunky world world && /chunky start
# Check status: /chunky status
# Check progress: /chunky progress

# === EARTH MAP NOTE ===
# When using an Earth Map (e.g. via Terra or custom import):
# Adjust world border limits to match the actual map dimensions.
# Earth Map 1:1000 is approximately ±18850 blocks on X and ±9500 on Z.
# /worldborder set 40000  (diameter, not radius)
