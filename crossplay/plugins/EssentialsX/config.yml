# Gunthercraft - EssentialsX config.yml
# Download: https://essentialsx.net/downloads.html
# ===================================================

# Locale - Sprache der Nachrichten
locale: de

# Passwort-Hash-Algorithmus (für OfflineMode-Server irrelevant wenn online-mode=true)
# Optionen: MD5, SHA1, SHA256, SHA512, bcrypt
# hash: SHA256  # auskommentiert weil online-mode=true

# Teleportation-Verzögerung in Sekunden (0 = sofort)
teleport-safety: true
teleport-delay: 3
teleport-cooldown: 5
teleport-back-when-hurt: false

# Home-Limit pro Spieler
sethome-multiple:
  default: 5
  vip: 15
  admin: unlimited

# /back-Befehl
respawn-listener-priority: normal
respawn-at-home: false

# Spawn
spawn-join-other-worlds: false
newbies:
  # Willkommensnachricht für neue Spieler
  announce-format: "§8[§aGunthercraft§8] §7{DISPLAYNAME} §aist dem Server beigetreten!"
  spawnpoint: spawn
  kit: ""

# Kits - nur aktivieren wenn nötig
# kits:
#   starter:
#     delay: 0
#     items:
#       - 32 bread

# Spawn-Schutz beim ersten Join
custom-join-message: "§8[§a+§8] §7{DISPLAYNAME}"
custom-quit-message: "§8[§c-§8] §7{DISPLAYNAME}"
custom-new-username-message: ""

# Economy
economy-log-enabled: false
economy-log-update-enabled: false
# Startgeld für neue Spieler
starting-balance: 500
# Währungsname
currency-symbol: "$"
currency-symbol-suffix: false

# Nickname-Einstellungen
change-displayname: true
add-prefix-in-player-list: true
disallow-icolors: false

# AFK
afk-sleep-percentage: 50
sleep-ignore-gamerule: false
afk-kick-message: "Du wurdest wegen Inaktivität gekickt."
afk-list-name: "§7[AFK] {USERNAME}"

# Nachrichten zwischen Spielern (/msg, /r)
last-message-reply-recipient: true
last-message-reply-recipient-timeout: 180

# Befehlssperren (z.B. um Vanilla-Befehle durch EssentialsX zu ersetzen)
disabled-commands:
  - nick
  # - god

# Sicherheit
op-name-color: "c"
custom-prefix: ""

# Maildienst
mail-per-minute: 1000

# Teleport-Request (/tpa) Timeout
tpa-accept-cancellation: 120

# Warp-Signschildunterstützung
enable-eco: true

# Mute-System
mute-commands:
  - msg
  - r
  - mail
  - emsg
  - tell
  - etell
  - whisper
  - ewhisper

# Chat-Radius (0 = global)
radius: 0

# Format der Chatnachrichten (erfordert EssentialsX Chat)
# Wird von DiscordSRV überschrieben wenn aktiv
format: '<{DISPLAYNAME}> {MESSAGE}'
