# Gunthercraft - EssentialsX config.yml
# Download: https://essentialsx.net/downloads.html
# ===================================================

# Locale for messages
locale: en

# Password hash algorithm (irrelevant for online-mode servers)
# Options: MD5, SHA1, SHA256, SHA512, bcrypt
# hash: SHA256  # commented out because online-mode=true

# Teleportation delay in seconds (0 = instant)
teleport-safety: true
teleport-delay: 3
teleport-cooldown: 5
teleport-back-when-hurt: false

# Home limit per player
sethome-multiple:
  default: 5
  vip: 15
  admin: unlimited

# /back command
respawn-listener-priority: normal
respawn-at-home: false

# Spawn
spawn-join-other-worlds: false
newbies:
  # Welcome message for new players
  announce-format: "§8[§aGunthercraft§8] §7{DISPLAYNAME} §ahas joined the server!"
  spawnpoint: spawn
  kit: ""

# Kit example (uncomment to enable)
# kits:
#   starter:
#     delay: 0
#     items:
#       - 32 bread

# Join / quit messages
custom-join-message: "§8[§a+§8] §7{DISPLAYNAME}"
custom-quit-message: "§8[§c-§8] §7{DISPLAYNAME}"
custom-new-username-message: ""

# Economy
economy-log-enabled: false
economy-log-update-enabled: false
# Starting balance for new players
starting-balance: 500
# Currency symbol
currency-symbol: "$"
currency-symbol-suffix: false

# Nickname settings
change-displayname: true
add-prefix-in-player-list: true
disallow-icolors: false

# AFK
afk-sleep-percentage: 50
sleep-ignore-gamerule: false
afk-kick-message: "You were kicked for being AFK."
afk-list-name: "§7[AFK] {USERNAME}"

# Private messages (/msg, /r)
last-message-reply-recipient: true
last-message-reply-recipient-timeout: 180

# Disabled commands (e.g. to override vanilla commands with EssentialsX)
disabled-commands:
  - nick
  # - god

# Staff settings
op-name-color: "c"
custom-prefix: ""

# Mail service
mail-per-minute: 1000

# Teleport request (/tpa) timeout in seconds
tpa-accept-cancellation: 120

# Sign shop support
enable-eco: true

# Mute system - commands blocked when muted
mute-commands:
  - msg
  - r
  - mail
  - emsg
  - tell
  - etell
  - whisper
  - ewhisper

# Chat radius (0 = global)
radius: 0

# Chat message format (requires EssentialsX Chat)
# Overridden by DiscordSRV when active
format: '<{DISPLAYNAME}> {MESSAGE}'
