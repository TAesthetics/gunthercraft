# Gunthercraft - WorldGuard config.yml
# Download: https://dev.bukkit.org/projects/worldguard
# =====================================================

mop-up-unprotected-entity-spawns: false

global-region:
  # Default flags for the entire world (global region)
  # Can be overridden per-region: /rg flag __global__ <flag> <value>
  build: allow
  pvp: allow
  tnt: deny
  chest-access: allow
  vehicle-place: allow
  vehicle-destroy: allow
  mob-spawning: allow
  creeper-explosion: deny   # disable creeper explosions globally
  ghast-fireball: deny
  other-explosion: deny
  fire-spread: deny         # disable fire spread
  lava-fire: deny
  lightning: allow
  block-trampling: deny     # farmland cannot be trampled by jumping
  use: allow

host-keys: {}

summary-on-start: true

# To protect the spawn region:
# /rg define spawn           (select area with //wand first)
# /rg flag spawn build deny
# /rg flag spawn pvp deny
# /rg flag spawn greeting "§aWelcome to Gunthercraft!"

# World settings
worlds:
  world:
    summary-on-start: true
  world_nether:
    summary-on-start: true
  world_the_end:
    summary-on-start: true
