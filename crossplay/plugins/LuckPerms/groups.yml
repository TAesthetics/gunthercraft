# Gunthercraft - LuckPerms Group Setup
# Download: https://luckperms.net/download
# ==========================================
# NOTE: LuckPerms stores its data in its own database.
# This file is a reference for initial setup via /lp commands.
# Run the commands below in the Minecraft console (without the leading "#").
#
# Group hierarchy:
#   owner > admin > moderator > vip > member (default)

# ==============================
# CONSOLE SETUP COMMANDS
# ==============================

# --- Create groups ---
# lp creategroup owner
# lp creategroup admin
# lp creategroup moderator
# lp creategroup vip
# lp creategroup member

# --- Set group weights (higher = higher priority) ---
# lp group owner meta setweight 100
# lp group admin meta setweight 80
# lp group moderator meta setweight 60
# lp group vip meta setweight 40
# lp group member meta setweight 20

# --- Set group prefixes (EssentialsX Chat) ---
# lp group owner meta setprefix 100 "§4[Owner] "
# lp group admin meta setprefix 80 "§c[Admin] "
# lp group moderator meta setprefix 60 "§e[Mod] "
# lp group vip meta setprefix 40 "§b[VIP] "
# lp group member meta setprefix 20 "§7[Member] "

# --- Group inheritance ---
# lp group admin parent set member
# lp group admin parent add moderator
# lp group moderator parent set member
# lp group vip parent set member

# --- Set default group for all players ---
# lp group default parent set member

# --- Permissions for member ---
# lp group member permission set essentials.home true
# lp group member permission set essentials.sethome true
# lp group member permission set essentials.tpa true
# lp group member permission set essentials.tpaccept true
# lp group member permission set essentials.tpdeny true
# lp group member permission set essentials.back true
# lp group member permission set essentials.spawn true
# lp group member permission set essentials.warp true
# lp group member permission set essentials.warp.list true
# lp group member permission set essentials.kit true
# lp group member permission set essentials.msg true
# lp group member permission set essentials.mail true
# lp group member permission set essentials.afk true
# lp group member permission set worldguard.region.claim true

# --- Permissions for vip ---
# lp group vip permission set essentials.sethome.multiple.vip true
# lp group vip permission set essentials.fly true
# lp group vip permission set essentials.nick true

# --- Permissions for moderator ---
# lp group moderator permission set essentials.kick true
# lp group moderator permission set essentials.mute true
# lp group moderator permission set essentials.jail true
# lp group moderator permission set essentials.warn true
# lp group moderator permission set essentials.vanish true
# lp group moderator permission set coreprotect.inspect true
# lp group moderator permission set coreprotect.restore true
# lp group moderator permission set worldguard.region.* true

# --- Permissions for admin ---
# lp group admin permission set * true
# lp group admin permission set -bukkit.command.op false  # block /op command

# --- Add a player to a group ---
# lp user PLAYERNAME parent set admin
