# Gunthercraft - Floodgate config.yml
# Allows Bedrock players to join without a Java account
# Download: https://geysermc.org/download (Floodgate-Spigot)
# =============================================================

# Prefix added to Bedrock player names (prevents name conflicts with Java players)
# Default is "." (dot) - invisible on Bedrock
username-prefix: "."

# Allow Bedrock players to use all languages including special characters
# Note: some plugins may behave unexpectedly with special characters
replace-spaces: true

# Show Bedrock platform type in player info
# (e.g. Xbox, PlayStation, Switch, Mobile, Windows)
send-floodgate-data: true

# Used when Geyser and Floodgate run on separate servers (BungeeCord/Velocity setups)
disconnect:
  invalid-key: Please connect through GeyserMC.
  invalid-arguments-length: Expected {0} arguments, got {1}.

# Database type for stored Bedrock link data
# "sqlite" for local database (default, sufficient for single servers)
player-link:
  enabled: true
  type: sqlite
  # Allow linking Bedrock and Java accounts via /linkaccount
  allowed: true
  # Only allow linking with the player's own Java account
  require-own-linking: false
  # How long a link code is valid (in seconds)
  link-code-timeout: 300

metrics:
  enabled: true
  uuid: generateduuid
