# Gunthercraft - Geyser-Spigot config.yml
# Allows Bedrock players to join the Java server
# ================================================
# Download: https://geysermc.org/download

bedrock:
  # IP Geyser listens on for Bedrock connections
  address: 0.0.0.0
  # Port for Bedrock players (UDP) - open this in your firewall!
  port: 19132
  broadcast-port: 19132
  # true = Bedrock port automatically mirrors Java port (useful for dynamic-port hosts)
  clone-remote-port: false
  # MOTD shown in the Bedrock server browser
  motd1: "Gunthercraft"
  motd2: "Java + Bedrock Crossplay"
  server-name: "Gunthercraft"
  compression-level: 6
  enable-proxy-protocol: false

remote:
  # "auto" = Geyser connects to the local Paper server (recommended when installed as plugin)
  address: auto
  port: 25565
  # "floodgate" = Bedrock accounts without a Java account. Floodgate must be installed!
  auth-type: floodgate
  use-proxy-protocol: false
  forward-hostname: false

# Path to the Floodgate key.pem (located in the Floodgate plugin folder)
floodgate-key-file: key.pem

# Passthrough: mirror MOTD, player count etc. from the Java server
passthrough-motd: true
passthrough-protocol-name: true
passthrough-player-counts: true
legacy-ping-passthrough: false
ping-passthrough-interval: 3

forward-player-ping: false

# Maximum displayed player count in the Bedrock server list (-1 = use Java value)
max-players: 100

debug-mode: false

# Thread pool size for Geyser (adjust based on available CPU cores)
general-thread-pool: 32

# Show OptiFine, LabyMod etc. capes for Bedrock players
allow-third-party-capes: true
allow-third-party-ears: false

# Fake cooldown animation for Bedrock players (Bedrock has no native attack cooldown)
show-cooldown: title

# Show coordinates in the Bedrock HUD
show-coordinates: true

disable-bedrock-scaffolding: false

emote-offhand-workaround: disabled

default-locale: en_us

# How many days to cache downloaded images (skins etc.)
cache-images: 7

# Show custom player skulls
allow-custom-skulls: true
max-visible-custom-skulls: 128
custom-skull-render-distance: 32

# Allow building above Y127 in the Nether (works around a Bedrock limitation)
above-bedrock-nether-building: false

# Force resource pack download
force-resource-packs: false

xbox-achievements-enabled: false

log-player-ip-addresses: true

notify-on-new-bedrock-update: true

unusable-space-block: minecraft:barrier

metrics:
  enabled: true
  uuid: generateduuid

scoreboard-packet-threshold: 20

enable-proxy-connections: false

# MTU for Bedrock packets (default: 1400)
mtu: 1400

use-direct-connection: true

# Disable compression if Bedrock players have fast connections
disable-compression: true
