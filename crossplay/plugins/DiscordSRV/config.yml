# Gunthercraft - DiscordSRV config.yml
# Links Minecraft chat to Discord
# Download: https://www.spigotmc.org/resources/discordsrv.18494/
# ==================================================================
# IMPORTANT: Fill in BotToken below!
# Create a bot: https://discord.com/developers/applications
# Required bot permissions: Send Messages, Read Message History, Manage Roles, Embed Links

# Bot token from the Discord Developer Portal
# Never share this publicly!
BotToken: "INSERT_BOT_TOKEN_HERE"

# Channel mapping: Minecraft channel name -> Discord channel ID
Channels:
  global: "DISCORD_CHANNEL_ID_FOR_CHAT"

# Additional channels (uncomment to enable)
# ConsoleChannel: "CONSOLE_CHANNEL_ID"

# Filter for console channel output
DiscordConsoleChannelFilters:
  - ".*\\[Async Chat Thread.*"

# Forward in-game messages to Discord and vice versa
DiscordChatChannelMinecraftToDiscord: true
DiscordChatChannelDiscordToMinecraft: true

# Minecraft -> Discord format
MinecraftChatToDiscordMessageFormat: "**%username%**: %message%"
MinecraftChatToDiscordMessageFormatNoPrimaryGroup: "**%username%**: %message%"

# Discord -> Minecraft format
DiscordToMinecraftMessageFormat: "§9[Discord] §b%username%§r: %message%"
DiscordToMinecraftMessageFormatNoPrimaryGroup: "§9[Discord] §b%username%§r: %message%"

# Server start/stop messages posted to Discord
DiscordChatChannelServerStartMessage: "Server **STARTED**"
DiscordChatChannelServerStopMessage: "Server **STOPPED**"

# Join / leave / death messages
DiscordJoinMessages: true
JoinMessage: "**%username%** joined the server."
LeaveMessage: "**%username%** left the server."
DeathMessage: "**%username%** died: %deathmessage%"

# Show player list in Discord
UpdateChannelName: false
DiscordChatChannelListPlayers: true

# Execute Minecraft commands from Discord (admin feature)
DiscordConsoleChannelEnabled: false
# ConsoleChannel: "ADMIN_CHANNEL_ID"
DiscordConsoleChannelWhitelist: []
DiscordConsoleChannelBlacklist: ["stop", "ban-ip"]

# Use Discord embeds instead of plain text
DiscordChatChannelUseDiscordEmbeds: false

# Mention protection (prevents @everyone/@here from in-game chat)
DiscordChatChannelTranslateMentions: true
DiscordChatChannelAllowedMentions:
  - USER

# Role synchronization (LuckPerms groups <-> Discord roles)
SynchronizePermissionsOnLogin: false
# GroupSynchronizationPrimaryGroupEnabled: false

# Webhook support (shows player avatars in Discord)
# Create webhook URL in Discord channel settings > Integrations
DiscordChatChannelWebhookEnabled: false
# DiscordChatChannelWebhookUrl: "WEBHOOK_URL"

DebugJDA: false
