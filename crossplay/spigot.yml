# Gunthercraft - spigot.yml
config-version: 12

settings:
  save-user-cache-on-stop-only: false
  sample-count: 12
  bungeecord: false
  late-bind: false
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 10.0
  netty-threads: 4
  attribute:
    maxHealth:
      max: 2048.0
    movementSpeed:
      max: 2048.0
    attackDamage:
      max: 2048.0
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.sh
  log-villager-deaths: true
  log-named-deaths: true
  debug: false

messages:
  whitelist: Du bist nicht auf der Whitelist!
  unknown-command: Unbekannter Befehl. Nutze /help für Hilfe.
  server-full: Der Server ist voll!
  outdated-client: 'Dein Client ist veraltet. Bitte nutze {0}!'
  outdated-server: 'Der Server ist veraltet. Ich nutze {0}!'
  restart: Server wird neu gestartet, bitte warte!

commands:
  spam-exclusions:
    - /skill
  silent-commandblock-console: false
  replace-commands:
    - setblock
    - summon
    - testforblock
    - tellraw
  log: true
  tab-complete: 0
  send-namespaced: true

stats:
  disable-saving: false
  forced-stats: {}

world-settings:
  default:
    below-zero-generation-in-existing-chunks: true
    end-portal-sound-radius: 0
    verbose: false
    item-despawn-rate: 6000
    view-distance: default
    simulation-distance: default
    thunder-chance: 100000
    hanging-tick-frequency: 100
    arrow-despawn-rate: 1200
    trident-despawn-rate: 1200
    zombie-aggressive-towards-villager: true
    nerf-spawner-mobs: false
    enable-zombie-pigmen-portal-spawns: true
    wither-spawn-sound-radius: 0
    entity-tracking-range:
      players: 96
      animals: 48
      monsters: 48
      misc: 32
      display: 128
      other: 64
    merge-radius:
      exp: 3.0
      item: 2.5
    mob-spawn-range: 8
    growth:
      cactus-modifier: 100
      cane-modifier: 100
      melon-modifier: 100
      mushroom-modifier: 100
      pumpkin-modifier: 100
      sapling-modifier: 100
      beetroot-modifier: 100
      carrot-modifier: 100
      potato-modifier: 100
      wheat-modifier: 100
      netherwart-modifier: 100
      vine-modifier: 100
      cocoa-modifier: 100
      bamboo-modifier: 100
      sweetberry-modifier: 100
      kelp-modifier: 100
      torchflower-modifier: 100
      pitcherplant-modifier: 100
    max-tnt-per-tick: 100
    max-tick-time:
      tile: 50
      entity: 50
    hopper-amount: 1
    hopper-can-load-chunks: false
    dragon-death-sound-radius: 0
    seed-village: 10387312
    seed-desert: 14357617
    seed-igloo: 14357618
    seed-jungle: 14357619
    seed-swamp: 14357620
