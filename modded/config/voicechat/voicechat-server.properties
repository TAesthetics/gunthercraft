# Gunthercraft - Simple Voice Chat Server Config
# Proximity Voice Chat für RP
# Download: https://www.curseforge.com/minecraft/mc-mods/simple-voice-chat
# =========================================================================
# WICHTIG: Port 24454 (UDP) in der Firewall öffnen!

# Bind-Port für Voice Chat (UDP)
port=24454

# Bind-IP (leer = alle Interfaces)
bind_address=

# Maximale Entfernung für Proximity Voice Chat (in Blöcken)
voice_chat_distance=48.0

# Maximale Entfernung für das Hören eines Spielers
crouch_distance_multiplier=1.0
whisper_distance_multiplier=0.5

# Fade-Faktor (wie schnell Stimmen leiser werden mit Entfernung)
# 1.0 = linear, höher = schneller
fade_distance=8.0

# Encoder-Bitrate (Audioqualität)
# Niedrig = weniger Bandbreite, Hoch = bessere Qualität
# Empfohlen für Community-Server: 64000
codec_bitrate=64000

# Keepalive-Intervall in Millisekunden
keep_alive=1000

# Voice Chat für alle Spieler standardmäßig aktiviert
enable_voice_chat=true

# Deaktivierte Spieler können anderen nicht zuhören
allow_recording=true

# Spektator können andere Spieler hören
spectator_interaction=false
spectator_player_possession=false

# Voice-Groups (für private Gespräche)
allow_groups=true
max_voice_chat_groups=10

# Direktnachrichten (1-zu-1 Voice)
allow_open_groups=true

# Microphone-Test im Pause-Menu anzeigen
show_mic_icon_in_tablist=true

# Komprimierung
opus_encoder_delay=0

# Broadcast (Admin kann an alle sprechen)
allow_admin_mode=true
