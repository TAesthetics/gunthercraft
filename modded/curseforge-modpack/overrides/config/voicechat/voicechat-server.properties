# Gunthercraft - Simple Voice Chat Server Config
# Proximity voice chat for RP
# Download: https://www.curseforge.com/minecraft/mc-mods/simple-voice-chat
# =========================================================================
# IMPORTANT: Open port 24454 (UDP) in your firewall!

# Bind port for voice chat (UDP)
port=24454

# Bind IP (empty = all interfaces)
bind_address=

# Maximum distance for proximity voice chat (in blocks)
voice_chat_distance=48.0

# Distance multipliers for crouching and whispering
crouch_distance_multiplier=1.0
whisper_distance_multiplier=0.5

# Fade distance (how quickly voices drop off with distance)
# 1.0 = linear, higher = faster drop-off
fade_distance=8.0

# Encoder bitrate (audio quality)
# Low = less bandwidth, high = better quality
# Recommended for community servers: 64000
codec_bitrate=64000

# Keepalive interval in milliseconds
keep_alive=1000

# Voice chat enabled by default for all players
enable_voice_chat=true

# Allow recording of voice chat
allow_recording=true

# Spectators can listen to other players
spectator_interaction=false
spectator_player_possession=false

# Voice groups (for private conversations)
allow_groups=true
max_voice_chat_groups=10

# Open groups (1-to-many voice)
allow_open_groups=true

# Show mic icon in tab list
show_mic_icon_in_tablist=true

# Opus encoder delay
opus_encoder_delay=0

# Broadcast mode (admin can speak to all players)
allow_admin_mode=true
