{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | CyberEnigma</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <section class="login-section">
        <h2>Member Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        {% if form.errors %}
            <p style="color:red;">Benutzername oder Passwort falsch.</p>
        {% endif %}
    </section>
</body>
</html>
