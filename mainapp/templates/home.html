{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
<!-- Additional head content specific to home page -->
{% endblock %}

{% block content %}
<!-- Hero Section -->

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <img src="{% static 'logo.png' %}" alt="CyberEnigma Logo" class="main-logo">
                <div class="teaser-text">
                    <h1>The next level of cyber culture is almost here.</h1>
                    <p>Are you ready to unlock the enigma?</p>
                </div>
                <div class="teaser-buttons">
                    <a href="https://discord.gg/gBercTcfzW" class="btn btn-discord">
                        <i class="fab fa-discord"></i> Join Discord
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Structured Data for Organization (SEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CyberEnigma",
      "url": "https://cyberenigma.dev",
      "logo": "https://cyberenigma.dev/static/logo.png",
      "sameAs": [
        "https://discord.gg/gBercTcfzW"
      ]
    }
    </script>
{% endblock %}

{% block extra_scripts %}
<!-- Additional scripts specific to home page -->
{% endblock %}
